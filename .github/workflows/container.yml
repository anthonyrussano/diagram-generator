name: Container image

on:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "Containerfile"
      - "containers/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build test image
        run: docker build --file Containerfile --tag diagram-gen:test .

      - name: Verify bundled toolchain
        run: |
          docker run --rm --entrypoint sh diagram-gen:test -c '
            diagram-gen --help >/dev/null &&
            aws --version &&
            kubectl version --client=true &&
            helm version --short &&
            dot -V &&
            mmdc --version
          '

      - name: Run tests in image
        run: |
          docker run --rm --entrypoint sh diagram-gen:test -c '
            cd /app &&
            uv run pytest tests/ -q &&
            uv run python -m py_compile src/agent_diagrams/*.py src/agent_diagrams/renderers/*.py
          '

      - name: Smoke all local renderers in image
        run: |
          docker run --rm --entrypoint sh diagram-gen:test -c '
            mkdir -p /tmp/output &&
            diagram-gen \
              --source json \
              --json /app/tests/snapshots/simple_graph.graph.json \
              --out-dir /tmp/output \
              --name container-smoke \
              --svg \
              --png \
              --diagram-format svg \
              --diagram-format png &&
            test -s /tmp/output/container-smoke.graph.json &&
            test -s /tmp/output/container-smoke.mmd &&
            test -s /tmp/output/container-smoke.svg &&
            test -s /tmp/output/container-smoke.png &&
            test -s /tmp/output/container-smoke.diagram.svg &&
            test -s /tmp/output/container-smoke.diagram.png &&
            diagram-gen spec-batch \
              --spec-dir /app/examples \
              --pattern "spec-*.yaml" \
              --out-dir /tmp/spec-output \
              --format svg \
              --format png &&
            test -s /tmp/spec-output/spec-architecture.svg &&
            test -s /tmp/spec-output/spec-architecture.png
          '

  publish:
    if: github.event_name != 'pull_request'
    needs: container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        # GitHub artifact attestations are unavailable for user-owned private repositories.
        if: github.event.repository.private == false
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
