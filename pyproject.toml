[project]
name = "agent-diagrams"
version = "0.2.0"
description = "Agent-oriented infrastructure diagram generator from AWS, Terraform, JSON, and Kubernetes sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "python-hcl2>=7.3.1,<8",
]

[project.optional-dependencies]
render = [
  "diagrams>=0.25.1",
]
aws-boto3 = [
  "boto3>=1.42.60",
  "diagrams>=0.25.1",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
diagram-gen = "agent_diagrams.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build]
exclude = ["**/node_modules", "**/.tools", "**/output", "**/*-chart", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel]
only-include = [
  "src/agent_diagrams",
  "integrations/statechart/scripts",
  "integrations/statechart/vendor",
  "integrations/statechart/examples",
  "integrations/statechart/package.json",
  "integrations/statechart/package-lock.json",
  "integrations/statechart/README.md",
]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"integrations/statechart" = "agent_diagrams/_statechart"
